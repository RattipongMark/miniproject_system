version: '3.8'

networks:
  public:
    driver: overlay

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public
    deploy:
      placement:
        constraints:
          - node.role == manager

  frontend:
    image: ghcr.io/${REPO_NAME}/frontend:latest
    networks:
      - public
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first

  backend:
    image: ghcr.io/${REPO_NAME}/backend:latest
    environment:
      - REDIS_HOST=db
    networks:
      - public
    deploy:
      replicas: 1

  db:
    image: redis:alpine
    networks:
      - public
    deploy:
      replicas: 1
